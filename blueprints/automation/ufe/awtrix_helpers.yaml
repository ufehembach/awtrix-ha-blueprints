input_text:
  awtrix_max_down:
    name: AWTRIX Max Down (letzter guter Speedtest-Wert)
    initial: "6"
    max: 255

  awtrix_max_up:
    name: AWTRIX Max Up (letzter guter Speedtest-Wert)
    initial: "3"
    max: 255

  download_rate_history:
    name: AWTRIX Download-Verlauf (JSON)
    initial: "[]"
    max: 255

  upload_rate_history:
    name: AWTRIX Upload-Verlauf (JSON)
    initial: "[]"
    max: 255

  awtrix_hist_last_append:
    name: AWTRIX Verlauf letzter Append-Zeitstempel
    initial: ""
    max: 255

  awtrix_text_cycle:
    name: AWTRIX Text-Cycle (0/1)
    initial: "0"
    max: 10

  awtrix_blink_frame:
    name: AWTRIX Blink-Frame (0-5)
    initial: "0"
    max: 10

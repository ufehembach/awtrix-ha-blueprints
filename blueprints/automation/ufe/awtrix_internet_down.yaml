blueprint:
  name: AWTRIX Internet-Down-Popup
  description: >-
    Zeigt ein rotes "Offline!"-Popup mit kurzem Warnton auf einem oder
    mehreren AWTRIX3-Displays, sobald der Ping/Connectivity-Sensor laenger
    als die angegebene Zeit "off" ist.


    Hinweis Multi-Device: Der MQTT-Topic-Praefix wird ueber device_attr(
    device_id, 'name') ermittelt, da AWTRIX3/Blueforcer den Geraetenamen bei
    der MQTT-Discovery direkt als Topic-Praefix registriert (z.B.
    "awtrix_d01974"). Pruefen unter Einstellungen -> Geraete & Dienste ->
    MQTT -> Geraeteliste: der dort angezeigte Name muss dem Topic-Praefix
    entsprechen.
  domain: automation
  input:
    ping_sensor:
      name: Ping/Connectivity Sensor
      description: Binary Sensor, "on" = Internet erreichbar
      selector:
        entity:
          domain: binary_sensor
    awtrix_devices:
      name: AWTRIX Geraete
      description: >-
        Ein oder mehrere AWTRIX3-Displays auswaehlen. Alle gewaehlten
        Displays zeigen das Popup gleichzeitig.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX 3
          multiple: true
    offline_seconds:
      name: Wartezeit bis "Offline" gemeldet wird (Sekunden)
      default: 30
      selector:
        number:
          min: 0
          max: 300
          mode: box
    notify_text:
      name: Popup-Text
      default: "Offline!"
      selector:
        text:
    notify_icon:
      name: LaMetric-Icon-ID
      description: >-
        LaMetric-Icon-IDs Connectivity-Status: 75254 / 75256 (online/offline,
        je nach gewünschter Variante).
      default: "75254"
      selector:
        text:
    notify_color:
      name: Textfarbe (Hex)
      default: "#FF0000"
      selector:
        text:
    notify_duration:
      name: Anzeigedauer (Sekunden)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          mode: box
    notify_rtttl:
      name: RTTTL-Warnton
      description: Leer lassen fuer keinen Ton
      default: "alarm:d=16,o=5,b=200:c"
      selector:
        text:

trigger:
  - trigger: state
    entity_id: !input ping_sensor
    to: "off"
    for:
      hours: 0
      minutes: 0
      seconds: !input offline_seconds

condition: []

action:
  - variables:
      awtrix_devices: !input awtrix_devices
      notify_text: !input notify_text
      notify_icon: !input notify_icon
      notify_color: !input notify_color
      notify_duration: !input notify_duration
      notify_rtttl: !input notify_rtttl
  - repeat:
      for_each: "{{ awtrix_devices }}"
      sequence:
        - variables:
            awtrix_prefix: "{{ device_attr(repeat.item, 'name') }}"
        - action: mqtt.publish
          data:
            topic: "{{ awtrix_prefix }}/notify"
            payload: >-
              {
                "text": "{{ notify_text }}",
                "icon": "{{ notify_icon }}",
                "color": "{{ notify_color }}",
                "duration": {{ notify_duration }},
                "hold": false
                {%- if notify_rtttl and notify_rtttl != '' -%}
                ,"rtttl": "{{ notify_rtttl }}"
                {%- endif -%}
              }
mode: single

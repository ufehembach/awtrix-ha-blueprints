blueprint:
  name: AWTRIX Netzwerk-Verlauf & Speed-Chart
  description: >-
    Zeigt WAN-Download/-Upload als Live-Text ("netspeed") plus rollierenden
    Verlaufs-Chart ("netchart") auf einem AWTRIX3-Display. Referenzwerte
    (Max) kommen vom Speedtest-Sensor und fallen bei 0/unavailable
    automatisch auf den letzten guten Wert zurueck.
  domain: automation
  input:
    speedtest_download:
      name: Speedtest Download Sensor
      description: Mbit/s, z.B. sensor.speedtest_download
      selector:
        entity:
          domain: sensor
    speedtest_upload:
      name: Speedtest Upload Sensor
      selector:
        entity:
          domain: sensor
    wan_download_rate:
      name: Live WAN Download-Rate Sensor
      description: Muss Bytes/s liefern (z.B. GL.iNet WAN-Sensor)
      selector:
        entity:
          domain: sensor
    wan_upload_rate:
      name: Live WAN Upload-Rate Sensor
      description: Muss Bytes/s liefern
      selector:
        entity:
          domain: sensor
    ping_sensor:
      name: Ping/Connectivity Sensor
      description: Binary Sensor, "on" = Internet erreichbar
      selector:
        entity:
          domain: binary_sensor
    awtrix_topic_prefix:
      name: AWTRIX MQTT Topic-Prefix
      default: awtrix_d01974
      selector:
        text:
    max_down_helper:
      name: Helper – letzter guter Max-Down-Wert
      selector:
        entity:
          domain: input_text
    max_up_helper:
      name: Helper – letzter guter Max-Up-Wert
      selector:
        entity:
          domain: input_text
    download_history_helper:
      name: Helper – Download-Verlauf (JSON-Array)
      selector:
        entity:
          domain: input_text
    upload_history_helper:
      name: Helper – Upload-Verlauf (JSON-Array)
      selector:
        entity:
          domain: input_text
    last_append_helper:
      name: Helper – Zeitstempel letzter Append
      selector:
        entity:
          domain: input_text
    text_cycle_helper:
      name: Helper – Text-Cycle (0/1)
      selector:
        entity:
          domain: input_text
    blink_frame_helper:
      name: Helper – Blink-Frame (0-5)
      selector:
        entity:
          domain: input_text
    history_length:
      name: Anzahl Spalten im Verlauf
      default: 30
      selector:
        number:
          min: 5
          max: 60
          mode: box

trigger:
  - trigger: time_pattern
    minutes: /2
  - trigger: state
    entity_id:
      - !input speedtest_download
      - !input speedtest_upload

condition: []

action:
  - variables:
      speedtest_download: !input speedtest_download
      speedtest_upload: !input speedtest_upload
      wan_download_rate: !input wan_download_rate
      wan_upload_rate: !input wan_upload_rate
      ping_sensor: !input ping_sensor
      awtrix_prefix: !input awtrix_topic_prefix
      max_down_helper: !input max_down_helper
      max_up_helper: !input max_up_helper
      download_history_helper: !input download_history_helper
      upload_history_helper: !input upload_history_helper
      last_append_helper: !input last_append_helper
      text_cycle_helper: !input text_cycle_helper
      blink_frame_helper: !input blink_frame_helper
      hist_len: !input history_length
  - variables:
      down_val: >-
        {{ (states(wan_download_rate) | float(0) * 8 / 1000000) | round(2) }}
      up_val: >-
        {{ (states(wan_upload_rate) | float(0) * 8 / 1000000) | round(2) }}
      down_hist_raw: "{{ states(download_history_helper) | from_json(default=[]) }}"
      up_hist_raw: "{{ states(upload_history_helper) | from_json(default=[]) }}"
      last_append: "{{ states(last_append_helper) }}"
      elapsed_min: "{{ (as_timestamp(now()) - as_timestamp(last_append, 0)) / 60 }}"
      should_append: "{{ elapsed_min >= 4 }}"
      down_hist: >-
        {{ (down_hist_raw[-(hist_len - 1):] + [down_val]) if should_append
        else down_hist_raw }}
      up_hist: >-
        {{ (up_hist_raw[-(hist_len - 1):] + [up_val]) if should_append else
        up_hist_raw }}
      down_raw: "{{ states(speedtest_download) }}"
      up_raw: "{{ states(speedtest_upload) }}"
      down_valid: "{{ down_raw not in ['unknown','unavailable',none,''] and (down_raw | float(0)) > 0 }}"
      up_valid: "{{ up_raw not in ['unknown','unavailable',none,''] and (up_raw | float(0)) > 0 }}"
      down_ref: "{{ (down_raw | float(0)) if down_valid else (states(max_down_helper) | float(6)) }}"
      up_ref: "{{ (up_raw | float(0)) if up_valid else (states(max_up_helper) | float(3)) }}"
      down_ref_eff: "{{ [down_ref, down_hist | max, down_val] | max }}"
      up_ref_eff: "{{ [up_ref, up_hist | max, up_val] | max }}"
      shared_vmax: "{{ [down_ref_eff, up_ref_eff] | max }}"
      down_pct: >-
        {{ [[(down_val / down_ref_eff * 100) | round(0) | int, 100] | min, 4]
        | max if down_ref_eff > 0 else 4 }}
      up_pct: >-
        {{ [[(up_val / up_ref_eff * 100) | round(0) | int, 100] | min, 4] |
        max if up_ref_eff > 0 else 4 }}
      lead_pct: "{{ [down_pct, up_pct] | max }}"
      lead_dots: "{{ 1 if lead_pct >= 66 else (2 if lead_pct >= 33 else 3) }}"
      lead_color: "{{ '#0080FF' if down_pct >= up_pct else '#FFA500' }}"
      icon_x: 0
      blink_frame: "{{ (states(blink_frame_helper) | int(0) + 1) % 6 }}"
      blink_dim: "#004040"
      blink_bright: "#00FFFF"
      row3_states: "{{ ['dim','dim','off','bright','bright','off'] }}"
      row4_states: "{{ ['off','dim','dim','off','bright','bright'] }}"
      blink_row3: "{{ row3_states[blink_frame] }}"
      blink_row4: "{{ row4_states[blink_frame] }}"
      combined_draw: >-
        {%- set ns = namespace(d=[
            {"dl": [icon_x, 0, icon_x, lead_dots - 1, lead_color]}
          ], dy=[], uy=[]) -%}
        {%- if blink_row3 != 'off' -%}
          {%- set ns.d = ns.d + [{"dp": [icon_x, 3, blink_bright if blink_row3 == 'bright' else blink_dim]}] -%}
        {%- endif -%} {%- if blink_row4 != 'off' -%}
          {%- set ns.d = ns.d + [{"dp": [icon_x, 4, blink_bright if blink_row4 == 'bright' else blink_dim]}] -%}
        {%- endif -%} {%- set logmax = (shared_vmax + 1) | log -%} {%- for i in
        range(down_hist | length) -%}
          {%- set ns.dy = ns.dy + [(7 - (((down_hist[i] + 1) | log) / logmax * 7) | round(0) | int) if shared_vmax > 0 else 7] -%}
        {%- endfor -%} {%- for i in range(up_hist | length) -%}
          {%- set ns.uy = ns.uy + [(7 - (((up_hist[i] + 1) | log) / logmax * 7) | round(0) | int) if shared_vmax > 0 else 7] -%}
        {%- endfor -%} {%- for i in range(down_hist | length - 1) -%}
          {%- set ns.d = ns.d + [{"dl": [icon_x + 2 + i, ns.dy[i], icon_x + 3 + i, ns.dy[i + 1], "#0080FF"]}] -%}
        {%- endfor -%} {%- for i in range(up_hist | length - 1) -%}
          {%- set ns.d = ns.d + [{"dl": [icon_x + 2 + i, ns.uy[i], icon_x + 3 + i, ns.uy[i + 1], "#FFA500"]}] -%}
        {%- endfor -%} {{ ns.d }}
      text_cycle: "{{ (states(text_cycle_helper) | int(0) + 1) % 2 }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ download_history_helper }}"
      value: "{{ down_hist | tojson }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ upload_history_helper }}"
      value: "{{ up_hist | tojson }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ last_append_helper }}"
      value: "{{ now().isoformat() if should_append else last_append }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ text_cycle_helper }}"
      value: "{{ text_cycle }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ blink_frame_helper }}"
      value: "{{ blink_frame }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ max_down_helper }}"
      value: "{{ down_ref }}"
  - action: input_text.set_value
    data:
      entity_id: "{{ max_up_helper }}"
      value: "{{ up_ref }}"
  - action: mqtt.publish
    data:
      qos: "0"
      retain: false
      topic: "{{ awtrix_prefix }}/custom/netspeed"
      payload: >-
        {%- macro fmt(v) -%}
          {%- if v >= 10 -%}{{ v | round(0) | int }}{%- else -%}{{ v | round(1) }}{%- endif -%}
        {%- endmacro -%} {%- set live = is_state(ping_sensor, 'on') -%} {%-
        set is_down = text_cycle == 0 -%} {%- set cur = down_val if is_down
        else up_val -%} {%- set ref = down_ref_eff if is_down else up_ref_eff
        -%} {%- set pct = down_pct if is_down else up_pct -%} {%- set icon = "51062"
        if is_down else "51060" -%} {%- set color = "#0080FF" if is_down else
        "#FFA500" -%} {%- set txt = "XXXX" if not live else (fmt(cur) ~ "/" ~
        fmt(ref) ~ "M") -%} {
          "text": "{{ txt }}",
          "icon": "{{ icon }}",
          "color": "{{ color }}",
          "progress": {{ pct }},
          "progressC": "{{ color }}",
          "lifetime": 180,
          "lifetimeMode": 1
        }
  - action: mqtt.publish
    data:
      qos: "0"
      retain: false
      topic: "{{ awtrix_prefix }}/custom/netchart"
      payload: |-
        {
          "draw": {{ combined_draw }},
          "lifetime": 180,
          "lifetimeMode": 1
        }
mode: single
